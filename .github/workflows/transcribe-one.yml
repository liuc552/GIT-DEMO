name: Transcribe One Zhezhi Video

on:
  push:
    branches: [master]
    paths:
      - 'urls.txt'
      - 'fetch_youtube_transcript.py'
      - '.github/workflows/transcribe-one.yml'
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transcript client
        run: pip install youtube-transcript-api

      - name: Fetch transcript from verified YouTube mirror
        run: |
          mkdir -p results
          python fetch_youtube_transcript.py

      - name: Preview transcript
        run: |
          echo '===== TRANSCRIPT PREVIEW ====='
          sed -n '1,120p' results/*.md

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhezhi-one-sample
          path: results/
          retention-days: 7
