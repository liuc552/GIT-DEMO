name: Transcribe One Zhezhi Video

on:
  push:
    branches: [master]
    paths:
      - 'urls.txt'
      - 'transcribe.py'
      - '.github/workflows/transcribe-one.yml'
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install f2 faster-whisper

      - name: Download one public Douyin video with F2
        run: |
          mkdir -p work results
          URL=$(grep -v '^#' urls.txt | sed '/^$/d' | head -n 1)
          echo "Downloading with F2: $URL"
          f2 dy -u "$URL" -M one -p work -n '{aweme_id}'
          find work -type f -maxdepth 4 -printf '%p %s bytes\n' || true

      - name: Transcribe
        run: python transcribe.py

      - name: Preview transcript
        run: |
          echo '===== TRANSCRIPT PREVIEW ====='
          sed -n '1,120p' results/*.md

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhezhi-one-sample
          path: results/
          retention-days: 7
