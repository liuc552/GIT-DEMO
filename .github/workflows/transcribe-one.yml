name: Transcribe One Zhezhi Video

on:
  push:
    branches: [master]
    paths:
      - 'urls.txt'
      - 'transcribe.py'
      - '.github/workflows/transcribe-one.yml'
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright faster-whisper 'mcp>=1.0' 'yt-dlp>=2026.6.9'
          python -m playwright install --with-deps chromium

      - name: Fetch specialized Douyin acquisition code
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/ZY-ZhichaoYu/douyin-transcribe.git vendor/douyin-transcribe

      - name: Download and transcribe one sample
        run: python transcribe.py

      - name: Preview transcript
        run: |
          echo '===== TRANSCRIPT PREVIEW ====='
          sed -n '1,100p' results/*.md

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhezhi-one-sample
          path: results/
          retention-days: 7
