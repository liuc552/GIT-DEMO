name: Transcribe One Zhezhi Video

on:
  push:
    branches: [master]
    paths:
      - 'urls.txt'
      - '.github/workflows/transcribe-one.yml'
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Fetch hosted transcript for verified mirror
        run: |
          mkdir -p results
          curl -fL --retry 2 --connect-timeout 15 --max-time 60 \
            'https://youtube-transcript.ai/transcript/8mQEzS-DXuE.txt' \
            -o results/8mQEzS-DXuE.md
          test -s results/8mQEzS-DXuE.md

      - name: Preview transcript
        run: |
          echo '===== TRANSCRIPT PREVIEW ====='
          sed -n '1,120p' results/8mQEzS-DXuE.md

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhezhi-one-sample
          path: results/
          retention-days: 7
