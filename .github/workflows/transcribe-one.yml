name: Transcribe One Zhezhi Video

on:
  push:
    branches: [master]
    paths:
      - 'urls.txt'
      - 'resolve_media.py'
      - 'transcribe.py'
      - '.github/workflows/transcribe-one.yml'
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install faster-whisper

      - name: Resolve and download one public Douyin video
        run: |
          mkdir -p work results
          python resolve_media.py
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 work/source.mp4

      - name: Transcribe
        run: python transcribe.py

      - name: Preview transcript
        run: |
          echo '===== TRANSCRIPT PREVIEW ====='
          sed -n '1,120p' results/*.md

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhezhi-one-sample
          path: results/
          retention-days: 7
