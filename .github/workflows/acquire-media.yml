name: Acquire Media

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public page URL or direct media URL
        required: true
        type: string
      adapter:
        description: Acquisition adapter
        required: true
        default: yt-dlp
        type: choice
        options:
          - direct
          - yt-dlp
          - douyin-open-source
      title:
        description: Optional title
        required: false
        default: ''
        type: string
      media_id:
        description: Stable media id
        required: true
        default: sample
        type: string

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'yt-dlp>=2026.8.19' playwright faster-whisper 'mcp<2'
          if [ "${{ inputs.adapter }}" = "douyin-open-source" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            python -m playwright install --with-deps chromium
          fi

      - name: Acquire media only
        run: |
          rm -rf handoff
          python pipeline/acquire_media.py \
            --source-url '${{ inputs.source_url }}' \
            --adapter '${{ inputs.adapter }}' \
            --title '${{ inputs.title }}' \
            --id '${{ inputs.media_id }}'
          test -s handoff/manifest.json
          ls -lh handoff

      - name: Upload media handoff
        uses: actions/upload-artifact@v4
        with:
          name: media-handoff
          path: handoff/
          retention-days: 1
